spring:
  application:
    name: financeflow

  config:
    import: optional:file:.env[.properties]

  profiles:
    default: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  error:
    include-stacktrace: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-minutes: 15
      refresh-token-days: 7

springdoc:
  swagger-ui:
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
